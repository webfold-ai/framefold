name: Supply chain

on:
  pull_request:
    paths:
      - "**/*.toml"
      - "**/*.lock"
      - "src/**"
      - "tests/**"
      - ".github/workflows/supply-chain.yml"
      - "deny.toml"
      - ".cargo/audit.toml"
  push:
    branches: [main]
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0 branch
        with:
          toolchain: 1.89.0
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit
        run: cargo audit --deny warnings

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0 branch
        with:
          toolchain: 1.89.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.19.4
      - name: Check dependency policy
        run: cargo deny check advisories bans licenses sources

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0 branch
        with:
          toolchain: 1.89.0
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Generate SBOM
        # --override-filename is a prefix; cargo-cyclonedx appends the extension.
        run: cargo cyclonedx --format json --override-filename framefold.sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: framefold-cyclonedx-sbom
          path: framefold.sbom.json
          retention-days: 90

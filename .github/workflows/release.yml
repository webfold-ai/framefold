name: Release

# Runs on a version tag. Creates a DRAFT release only; publishing is a manual step.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and draft release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0 branch
        with:
          toolchain: 1.89.0
      - name: Check tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v${PACKAGE_VERSION}" = "${TAG_NAME}"
      - name: Build and test the tagged tree
        run: |
          cargo build --locked --release --bin framefold
          cargo test --locked
      - name: Package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp target/release/framefold "dist/framefold-${TAG_NAME}-linux-x86_64"
          tar -czf "dist/framefold-${TAG_NAME}-linux-x86_64.tar.gz" -C dist "framefold-${TAG_NAME}-linux-x86_64"
          (cd dist && sha256sum "framefold-${TAG_NAME}-linux-x86_64.tar.gz" > SHA256SUMS)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release artifacts (keyless, one bundle per file)
        run: |
          cd dist
          for f in framefold-*.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Generate SLSA build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/framefold-*.tar.gz"
      - name: Copy provenance bundle to the release assets
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "dist/framefold-${TAG_NAME}-linux-x86_64.tar.gz.intoto.jsonl"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG_NAME" --draft \
            "framefold-${TAG_NAME}-linux-x86_64.tar.gz" \
            "framefold-${TAG_NAME}-linux-x86_64.tar.gz.sigstore.json" \
            "framefold-${TAG_NAME}-linux-x86_64.tar.gz.intoto.jsonl" \
            SHA256SUMS SHA256SUMS.sigstore.json \
            --generate-notes

# configuration for https://release-plz.dev

[workspace]
changelog_config = "cliff.toml"

# Publish only when a release PR is merged, never on an ordinary push to main.
release_always = false

git_release_body = """\
# framefold v{{ version }}

Native compositor: HTML-style compositions to video frames, without a browser.

{{ changelog | replace(from="<!-- generated by git-cliff -->", to="") | trim }}
"""
EOF
